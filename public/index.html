<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Haushaltspunkte</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Punkte">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F1F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1120" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F1F2F7; --surface:#FFFFFF; --sunk:#E6E8F0; --fg:#171A2C; --muted:#646A85; --line:#DADDE8;
  --a:#2F49D1; --b:#D9821C; --ok:#1E8A55; --danger:#C2352B;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px; color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#0E1120; --surface:#191D30; --sunk:#232840; --fg:#ECEEF8; --muted:#9AA0BC; --line:#2C3150;
  --a:#8296FF; --b:#F2AE55; --ok:#4CC88A; --danger:#FF7A6E; color-scheme:dark } }
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 120px);
  -webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--a);outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:1.45rem;letter-spacing:-.01em;margin:0}
.iconbtn{border:0;background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.9rem;color:var(--muted)}
.iconbtn b{color:var(--fg)}
.score{background:var(--surface);border-radius:22px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px}
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:3px;align-self:flex-start}
.seg button{border:0;background:none;padding:6px 12px;border-radius:999px;font-size:.85rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.p{display:flex;flex-direction:column;gap:2px;min-width:0}
.p.b{text-align:right}
.p .nm{font-weight:600;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p.a .nm{color:var(--a)} .p.b .nm{color:var(--b)}
.p .pts{font-family:var(--display);font-weight:800;font-size:3.2rem;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.p .unit{font-size:.8rem;color:var(--muted)}
.bar{height:10px;border-radius:999px;background:var(--b);overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--a);transition:width .4s ease}
.bar.empty{background:var(--sunk)} .bar.empty i{width:0!important}
.lead{font-size:.88rem;color:var(--muted);margin:0}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.hint{font-size:.8rem;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:500}
.hint b{font-weight:700}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.task{position:relative;border-radius:var(--r);overflow:hidden;background:var(--sunk)}
.task .bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:700;color:#fff}
.task .bg span{opacity:0;transition:opacity .15s}
.task[data-dir="me"] .bg{background:var(--mecol)} .task[data-dir="me"] .bg .l{opacity:1}
.task[data-dir="other"] .bg{background:var(--othercol)} .task[data-dir="other"] .bg .r{opacity:1}
.card{position:relative;background:var(--surface);border-radius:var(--r);padding:14px 14px 14px 16px;display:flex;align-items:center;gap:12px;
  touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.card.drag{transition:none}
.card .t{flex:1;min-width:0}
.card .ti{font-weight:600;overflow-wrap:anywhere}
.card .meta{font-size:.8rem;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--sunk);border-radius:6px;padding:1px 7px;font-weight:600;font-size:.74rem;color:var(--muted)}
.pill{font-family:var(--display);font-weight:800;font-size:1.05rem;min-width:44px;text-align:center;padding:6px 8px;border-radius:12px;background:var(--sunk);font-variant-numeric:tabular-nums}
.pill small{font-family:var(--body);font-weight:600;font-size:.68rem;color:var(--muted);display:block;margin-top:-2px}
.done-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;border:1px dashed var(--line);color:var(--muted);font-size:.9rem}
.done-row .who{margin-left:auto;font-weight:700;font-size:.8rem}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.empty{background:var(--surface);border-radius:var(--r);padding:20px;color:var(--muted);text-align:center;font-size:.92rem}
.hist li{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:.9rem}
.hist li:last-child{border-bottom:0}
.hist .what{flex:1;min-width:0;overflow-wrap:anywhere}
.when{color:var(--muted);font-size:.78rem}
.hist .plus{font-weight:700;font-variant-numeric:tabular-nums}
.undo{border:0;background:none;color:var(--muted);font-size:.78rem;font-weight:600;padding:4px 6px;border-radius:8px}
.undo.sure{background:var(--danger);color:#fff}
.fab{position:fixed;right:calc(max(16px,env(safe-area-inset-right,0px)) + 4px);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);
  border:0;background:var(--fg);color:var(--bg);border-radius:999px;padding:14px 20px;font-weight:700;font-size:1rem;box-shadow:0 6px 20px rgba(0,0,0,.2);display:flex;gap:6px;align-items:center}
.fab span{font-size:1.3rem;line-height:1}
.scrim{position:fixed;inset:0;background:rgba(10,12,25,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:22px 22px 0 0;
  padding:20px max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(18px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:16px;max-height:88vh;overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.sheet h3,.login h2{font-family:var(--display);font-weight:800;font-size:1.3rem;margin:0;text-wrap:balance}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.88rem}
input[type=text],input[type=email],input[type=password]{font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stepper{display:flex;align-items:center;gap:4px;background:var(--bg);border-radius:12px;padding:4px}
.stepper button{border:0;background:var(--surface);width:40px;height:40px;border-radius:10px;font-size:1.3rem;font-weight:700}
.stepper output{min-width:44px;text-align:center;font-family:var(--display);font-weight:800;font-size:1.3rem;font-variant-numeric:tabular-nums}
.switch{position:relative;width:52px;height:30px;flex:none}
.switch input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer}
.switch i{position:absolute;inset:0;background:var(--sunk);border-radius:999px;transition:background .2s;pointer-events:none}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked + i{background:var(--ok)} .switch input:checked + i::after{transform:translateX(22px)}
.sub{font-size:.8rem;color:var(--muted);font-weight:400}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1;border:0;border-radius:14px;padding:14px;font-weight:700;background:var(--sunk);min-width:120px}
.btn.primary{background:var(--fg);color:var(--bg)}
.btn.pa{background:var(--a);color:#fff} .btn.pb{background:var(--b);color:#fff}
.btn.danger{background:transparent;color:var(--danger);flex:none}
.btn.danger.sure{background:var(--danger);color:#fff}
.linkbtn{border:0;background:none;color:var(--muted);font-weight:600;font-size:.88rem;text-decoration:underline;padding:4px}
.whogrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.whogrid button{border:2px solid var(--line);background:var(--bg);border-radius:16px;padding:18px 10px;font-weight:700;font-size:1.05rem}
.whogrid button[aria-pressed="true"]{border-color:var(--fg)}
.whogrid .wa{color:var(--a)} .whogrid .wb{color:var(--b)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 86px);z-index:30;
  background:var(--fg);color:var(--bg);border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;font-weight:600;font-size:.92rem;
  max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast button{border:0;background:rgba(127,127,127,.25);color:inherit;border-radius:10px;padding:6px 10px;font-weight:700}
.login{max-width:420px;margin:8vh auto 0;background:var(--surface);border-radius:22px;padding:24px 20px;display:flex;flex-direction:column;gap:16px}
.err{color:var(--danger);font-size:.88rem;margin:0}
.status{font-size:.85rem;color:var(--muted);text-align:center}
.view{display:flex;flex-direction:column;gap:22px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:14px;padding:4px;gap:4px}
.tabs button{border:0;background:none;padding:10px;border-radius:10px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.badge{background:var(--fg);color:var(--bg);border-radius:999px;font-size:.72rem;padding:1px 7px;min-width:20px;font-variant-numeric:tabular-nums}
.shopadd{display:flex;gap:8px}
.shopadd input{flex:1;min-width:0}
.shopadd .btn{flex:none;min-width:0;padding:12px 16px}
.shoplist{gap:6px}
.shopitem{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:14px;padding:6px 6px 6px 12px;cursor:pointer;user-select:none;-webkit-user-select:none}
.shopitem .chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:none;flex:none;color:transparent;font-weight:800;font-size:.9rem;display:flex;align-items:center;justify-content:center;padding:0}
.shopitem.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.shopitem .txt{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
.shopitem.done .txt{text-decoration:line-through;color:var(--muted)}
.shopitem .by{font-size:.74rem;font-weight:700;flex:none}
.shopitem .del{border:0;background:none;color:var(--muted);font-size:1.4rem;line-height:1;width:40px;height:40px;border-radius:10px;flex:none}
.shopfoot{display:flex;align-items:center;justify-content:space-between;gap:12px}
.linkbtn.sure{color:var(--danger)}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border-radius:12px;padding:4px;gap:4px}
.seg3 button{border:0;background:none;padding:10px 4px;border-radius:9px;font-weight:600;font-size:.88rem;color:var(--muted)}
.seg3 button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.fgroup{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.88rem}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<form class="login" id="login" hidden>
  <h2 id="loginTitle">Anmelden</h2>
  <p class="sub" style="margin:0" id="loginSub">Melde dich an, um eure Punkte zu sehen.</p>
  <label class="f" for="l-email">E-Mail<input type="email" id="l-email" autocomplete="email" required></label>
  <label class="f" for="l-pw">Passwort<input type="password" id="l-pw" autocomplete="current-password" minlength="6" required></label>
  <p class="err" id="l-err" hidden></p>
  <button type="submit" class="btn primary" id="l-submit">Anmelden</button>
  <button type="button" class="linkbtn" id="l-toggle">Noch kein Konto? Konto erstellen</button>
</form>

<div class="wrap" id="app" hidden>
  <header>
    <h1>Haushaltspunkte</h1>
    <button class="iconbtn" id="settingsBtn" type="button">Du: <b id="meLabel">–</b></button>
  </header>
  <div class="tabs" role="tablist" aria-label="Bereich">
    <button type="button" role="tab" data-tab="tasks" aria-selected="true">Aufgaben</button>
    <button type="button" role="tab" data-tab="shop" aria-selected="false">Einkauf <span class="badge" id="shopBadge" hidden>0</span></button>
  </div>
  <div class="view" id="viewTasks">
  <section class="score" aria-label="Punktestand">
    <div class="seg" role="group" aria-label="Zeitraum">
      <button type="button" data-period="week" aria-pressed="true">Diese Woche</button>
      <button type="button" data-period="month" aria-pressed="false">Monat</button>
      <button type="button" data-period="all" aria-pressed="false">Gesamt</button>
    </div>
    <div class="duo">
      <div class="p a"><span class="nm" id="nameA">Person 1</span><span class="pts" id="ptsA">0</span><span class="unit">Punkte</span></div>
      <div class="p b"><span class="nm" id="nameB">Person 2</span><span class="pts" id="ptsB">0</span><span class="unit">Punkte</span></div>
    </div>
    <div class="bar empty" id="bar"><i id="barA"></i></div>
    <p class="lead" id="lead">Noch keine Punkte in diesem Zeitraum.</p>
  </section>
  <section class="sec">
    <h2><span>Offen</span><span class="hint" id="hint"></span></h2>
    <ul id="openList"></ul>
  </section>
  <section class="sec" id="doneSec" hidden>
    <h2><span>Schon erledigt</span></h2>
    <ul id="doneList"></ul>
  </section>
  <section class="sec">
    <h2><span>Verlauf</span></h2>
    <ul class="hist" id="histList"></ul>
  </section>
  </div>
  <div class="view" id="viewShop" hidden>
    <form class="shopadd" id="shopForm">
      <input type="text" id="shopInput" placeholder="Was fehlt? z.B. Katzenstreu" maxlength="80" autocomplete="off" enterkeyhint="send" aria-label="Neuer Eintrag">
      <button type="submit" class="btn primary">Dazu</button>
    </form>
    <ul class="shoplist" id="shopList"></ul>
    <div class="shopfoot" id="shopFoot" hidden><span class="sub" id="shopCount"></span><button type="button" class="linkbtn" id="shopClear">Erledigte löschen</button></div>
  </div>
  <p class="status" id="status"></p>
</div>

<button class="fab" id="fab" type="button" hidden><span>+</span> Aufgabe</button>
<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden><span id="toastMsg"></span><button type="button" id="toastUndo">Rückgängig</button></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, collection, onSnapshot,
  setDoc, updateDoc, deleteDoc, getDoc, deleteField }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { firebaseConfig } from "./config.js";

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
let db;
try { db = initializeFirestore(fbApp, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
catch(e){ db = initializeFirestore(fbApp, {}); }

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const pad = n => String(n).padStart(2,'0');
const dayKey = (d=new Date()) => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const monthKey = (d=new Date()) => d.getFullYear()+'-'+pad(d.getMonth()+1);
function weekStartKey(){ const d=new Date(); d.setDate(d.getDate()-((d.getDay()+6)%7)); return dayKey(d); }
const lsGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k,v); } catch(e){} };

const S = { uid:null, me:lsGet('hp.me'), names:{a:'Person 1',b:'Person 2'}, tasks:[], months:{}, shop:[], period:lsGet('hp.period')||'week',
  tab:lsGet('hp.tab')||'tasks', dragging:false, dirty:false, loaded:{tasks:false,names:false,me:false,shop:false}, unsubs:[] };
const other = w => w==='a'?'b':'a';
const rep = t => t.repeat || (t.daily ? 'daily' : 'none');
const REP_TAG = {none:'einmalig', daily:'↻ täglich', weekly:'↻ wöchentlich'};
const REP_TEXT = {none:'einmalig', daily:'jeden Tag', weekly:'jede Woche'};
const REP_HINT = {none:'Verschwindet, sobald sie erledigt ist.', daily:'Taucht jeden Tag wieder auf.', weekly:'Einmal pro Woche. Ab Montag ist sie wieder offen.'};
const REP_ORDER = {daily:0, weekly:1, none:2};
const nm = w => S.names[w] || (w==='a'?'Person 1':'Person 2');

function entries(){
  const out=[];
  for (const [docId, m] of Object.entries(S.months))
    for (const [id, e] of Object.entries(m.entries || {})) if (e) out.push({...e, id, docId, who:m.who});
  return out.sort((x,y)=> (y.at||'').localeCompare(x.at||''));
}

/* ---------- Anzeige ---------- */
function render(){
  if (S.dragging){ S.dirty=true; return; }
  S.dirty=false;
  const all = entries(), today = dayKey(), me = S.me||'a';
  document.documentElement.style.setProperty('--mecol', me==='b'?'var(--b)':'var(--a)');
  document.documentElement.style.setProperty('--othercol', me==='b'?'var(--a)':'var(--b)');
  $('#meLabel').textContent = S.me ? nm(S.me) : 'wählen';
  $('#nameA').textContent = nm('a'); $('#nameB').textContent = nm('b');

  const from = S.period==='week' ? weekStartKey() : S.period==='month' ? monthKey()+'-01' : '';
  let pa=0,pb=0;
  for (const e of all) if (!from || e.day>=from){ if(e.who==='a') pa+=Number(e.points)||0; else pb+=Number(e.points)||0; }
  $('#ptsA').textContent=pa; $('#ptsB').textContent=pb;
  const tot=pa+pb; $('#bar').classList.toggle('empty', tot===0); $('#barA').style.width = tot ? (pa/tot*100)+'%' : '0';
  const label = {week:'diese Woche',month:'diesen Monat',all:'insgesamt'}[S.period];
  const diff = Math.abs(pa-pb);
  $('#lead').textContent = tot===0 ? 'Noch keine Punkte '+label+'.' : pa===pb ? 'Gleichstand '+label+'.'
    : (pa>pb?nm('a'):nm('b'))+' liegt '+label+' mit '+diff+' Punkt'+(diff===1?'':'en')+' vorne.';
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.period===S.period)));

  $('#hint').innerHTML = S.me ? `<b style="color:var(--othercol)">←</b> ${esc(nm(other(me)))} · ${esc(nm(me))} <b style="color:var(--mecol)">→</b>` : '';

  const wk = weekStartKey();
  const lastByTask = new Map();
  for (const e of all) if (!lastByTask.has(e.taskId)) lastByTask.set(e.taskId, e);
  const doneEntry = t => { const r=rep(t); if(r==='none') return null; const e=lastByTask.get(t.id); if(!e) return null;
    return (r==='daily' ? e.day===today : e.day>=wk) ? e : null; };
  const tasks = [...S.tasks].sort((x,y)=> REP_ORDER[rep(x)]-REP_ORDER[rep(y)] || (x.createdAt||'').localeCompare(y.createdAt||''));
  const open = tasks.filter(t => rep(t)==='none' ? !t.done : !doneEntry(t));
  const done = tasks.filter(t => rep(t)!=='none' && doneEntry(t));
  const ol = $('#openList');
  if (!S.loaded.tasks) ol.innerHTML = '<li class="empty">Aufgaben werden geladen …</li>';
  else if (!open.length) ol.innerHTML = '<li class="empty">'+(S.tasks.length ? 'Alles erledigt. Schön!' : 'Noch keine Aufgaben. Tippe unten auf „+ Aufgabe“, z.B. „Katzenklo, täglich, 1 Punkt“.')+'</li>';
  else ol.innerHTML = open.map(t => `
    <li class="task" data-id="${esc(t.id)}">
      <div class="bg" aria-hidden="true"><span class="l">✓ ${esc(nm(me))}</span><span class="r">${esc(nm(other(me)))} ✓</span></div>
      <div class="card" tabindex="0" role="button" aria-label="${esc(t.title)}, ${Number(t.points)||0} Punkte. Antippen für Optionen">
        <div class="t"><div class="ti">${esc(t.title)}</div>
          <div class="meta"><span class="tag">${REP_TAG[rep(t)]}</span></div></div>
        <div class="pill">${Number(t.points)||0}<small>Pkt</small></div>
      </div>
    </li>`).join('');
  $('#doneSec').hidden = !done.length;
  $('#doneList').innerHTML = done.map(t => { const e=doneEntry(t); return `
    <li class="done-row"><span class="dot" style="background:var(--${e.who})"></span><span>${esc(t.title)} <span class="when">· ${rep(t)==='weekly'?'diese Woche':'heute'}</span></span>
    <span class="who" style="color:var(--${e.who})">${esc(nm(e.who))} · +${Number(e.points)||0}</span></li>`; }).join('');

  const recent = all.slice(0,30);
  $('#histList').innerHTML = recent.length ? recent.map(e => `
    <li><span class="dot" style="background:var(--${e.who})"></span>
      <span class="what">${esc(e.title)}<br><span class="when">${esc(nm(e.who))} · ${fmtWhen(e.at)}</span></span>
      <span class="plus" style="color:var(--${e.who})">+${Number(e.points)||0}</span>
      <button type="button" class="undo" data-undo="${esc(e.docId)}|${esc(e.id)}">Zurücknehmen</button></li>`).join('')
    : '<li class="when" style="border:0">Hier erscheint, wer wann was erledigt hat.</li>';
  renderShop();
}

/* ---------- Einkaufsliste ---------- */
function renderShop(){
  const items = [...S.shop].sort((a,b)=> (a.done?1:0)-(b.done?1:0)
    || (a.done ? (b.doneAt||'').localeCompare(a.doneAt||'') : (a.createdAt||'').localeCompare(b.createdAt||'')));
  const open = items.filter(i=>!i.done).length, done = items.length-open;
  const badge = $('#shopBadge'); badge.textContent = open; badge.hidden = !open;
  const ul = $('#shopList');
  if (!S.loaded.shop) ul.innerHTML = '<li class="empty">Liste wird geladen …</li>';
  else if (!items.length) ul.innerHTML = '<li class="empty">Die Liste ist leer. Schreib oben rein, was fehlt.</li>';
  else ul.innerHTML = items.map(i => `
    <li class="shopitem${i.done?' done':''}" data-id="${esc(i.id)}">
      <button type="button" class="chk" aria-pressed="${!!i.done}" aria-label="${esc(i.text)} ${i.done?'nicht mehr abhaken':'abhaken'}">✓</button>
      <span class="txt">${esc(i.text)}</span>
      ${i.by ? `<span class="by" style="color:var(--${i.by==='b'?'b':'a'})">${esc(nm(i.by))}</span>` : ''}
      <button type="button" class="del" aria-label="${esc(i.text)} löschen">×</button>
    </li>`).join('');
  $('#shopFoot').hidden = !done;
  $('#shopCount').textContent = open+' offen · '+done+' erledigt';
}
$('#shopForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const inp=$('#shopInput'), text=inp.value.trim(); if(!text) return;
  inp.value=''; inp.focus();
  try{ await setDoc(doc(db,'shopping',rid()), {text, done:false, createdAt:new Date().toISOString(), by:S.me||null}); }
  catch(err){ toast('Konnte nicht speichern.'); inp.value=text; }
});
$('#shopList').addEventListener('click', async e=>{
  const li=e.target.closest('.shopitem'); if(!li) return;
  const it=S.shop.find(x=>x.id===li.dataset.id); if(!it) return;
  try{
    if (e.target.closest('.del')){
      await deleteDoc(doc(db,'shopping',it.id));
      toast('„'+it.text+'“ gelöscht', ()=>setDoc(doc(db,'shopping',it.id), {text:it.text, done:!!it.done, createdAt:it.createdAt||new Date().toISOString(), by:it.by||null, doneAt:it.doneAt||null}));
    } else {
      await updateDoc(doc(db,'shopping',it.id), {done:!it.done, doneAt: it.done ? null : new Date().toISOString()});
    }
  }catch(err){ toast('Das hat nicht geklappt.'); }
});
$('#shopClear').addEventListener('click', async ()=>{
  const b=$('#shopClear');
  if(!b.classList.contains('sure')){ b.classList.add('sure'); b.textContent='Wirklich alle löschen?';
    setTimeout(()=>{ b.classList.remove('sure'); b.textContent='Erledigte löschen'; }, 3000); return; }
  b.classList.remove('sure'); b.textContent='Erledigte löschen';
  const doneItems=S.shop.filter(i=>i.done);
  try{ await Promise.all(doneItems.map(i=>deleteDoc(doc(db,'shopping',i.id)))); toast(doneItems.length+' erledigte Einträge gelöscht'); }
  catch(err){ toast('Löschen hat nicht geklappt.'); }
});
function setTab(t){
  S.tab = t==='shop' ? 'shop' : 'tasks'; lsSet('hp.tab', S.tab);
  $('#viewTasks').hidden = S.tab!=='tasks'; $('#viewShop').hidden = S.tab!=='shop';
  $('#fab').hidden = S.tab!=='tasks' || !S.uid;
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected', String(b.dataset.tab===S.tab)));
}
document.querySelector('.tabs').addEventListener('click', e=>{ const b=e.target.closest('button[data-tab]'); if(b) setTab(b.dataset.tab); });
function fmtWhen(iso){
  if(!iso) return ''; const d=new Date(iso); const t=pad(d.getHours())+':'+pad(d.getMinutes());
  const y=new Date(); y.setDate(y.getDate()-1);
  if (dayKey(d)===dayKey()) return 'heute '+t; if (dayKey(d)===dayKey(y)) return 'gestern '+t;
  return d.toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'})+' '+t;
}

/* ---------- Daten ---------- */
async function complete(t, who){
  const now = new Date(), id = rid(), key = monthKey(now)+'_'+who;
  const r = rep(t);
  const entry = {taskId:t.id, title:t.title, points:Number(t.points)||1, repeat:r, daily:r==='daily', day:dayKey(now), at:now.toISOString()};
  try {
    const p = setDoc(doc(db,'months',key), {who, month:monthKey(now), entries:{[id]:entry}}, {merge:true});
    toast('+'+entry.points+' für '+nm(who), () => undo(key, id));
    await p;
    if (r==='none') await updateDoc(doc(db,'tasks',t.id), {done:true});
  } catch(e){ toast('Konnte nicht speichern. Bitte nochmal versuchen.'); }
}
async function undo(docId, id){
  const e = S.months[docId]?.entries?.[id];
  try {
    await updateDoc(doc(db,'months',docId), {['entries.'+id]: deleteField()});
    const t = e && S.tasks.find(x=>x.id===e.taskId);
    if (t && rep(t)==='none') await updateDoc(doc(db,'tasks',t.id), {done:false});
  } catch(err){ toast('Zurücknehmen hat nicht geklappt.'); }
}

/* ---------- Wischen ---------- */
let g = null;
const list = $('#openList');
list.addEventListener('pointerdown', e => {
  const li = e.target.closest('.task'); if(!li || (e.button && e.button!==0)) return;
  g = {li, card:li.querySelector('.card'), x:e.clientX, y:e.clientY, pid:e.pointerId, dx:0, mode:null, w:li.offsetWidth};
});
window.addEventListener('pointermove', e => {
  if(!g || e.pointerId!==g.pid) return;
  const dx=e.clientX-g.x, dy=e.clientY-g.y;
  if(!g.mode){
    if(Math.abs(dx)>8 && Math.abs(dx)>Math.abs(dy)){ g.mode='swipe'; S.dragging=true; g.card.classList.add('drag'); try{g.li.setPointerCapture(g.pid);}catch(_){} }
    else if(Math.abs(dy)>8) g.mode='scroll';
  }
  if(g.mode==='swipe'){
    g.dx=dx; g.card.style.transform='translateX('+dx+'px)';
    g.li.dataset.dir = dx>0 ? 'me' : 'other';
  }
}, {passive:true});
function endGesture(e, cancelled){
  if(!g || (e && e.pointerId!==g.pid)) return;
  const {li, card, dx, mode, w} = g; g=null;
  const t = S.tasks.find(x=>x.id===li.dataset.id);
  if (mode==='swipe'){
    card.classList.remove('drag');
    if (!cancelled && Math.abs(dx) > w*0.32 && t){
      if(!S.me){ card.style.transform=''; S.dragging=false; settingsSheet(true); return; }
      card.style.transform = 'translateX('+(dx>0?w:-w)+'px)';
      const who = dx>0 ? S.me : other(S.me);
      if (navigator.vibrate) try{ navigator.vibrate(15); }catch(_){}
      setTimeout(()=>{ S.dragging=false; complete(t, who); render(); }, 200);
      return;
    }
    card.style.transform=''; setTimeout(()=>{ delete li.dataset.dir; }, 220);
    S.dragging=false; if(S.dirty) setTimeout(render, 230);
  } else if (!mode && !cancelled && t){ taskSheet(t); }
}
window.addEventListener('pointerup', e=>endGesture(e,false));
window.addEventListener('pointercancel', e=>endGesture(e,true));
list.addEventListener('keydown', e => {
  if((e.key==='Enter'||e.key===' ') && e.target.classList.contains('card')){ e.preventDefault();
    const t=S.tasks.find(x=>x.id===e.target.closest('.task').dataset.id); if(t) taskSheet(t); }
});

/* ---------- Fenster ---------- */
const scrim=$('#scrim'), sheet=$('#sheet');
function openSheet(html){ sheet.innerHTML=html; scrim.hidden=false; }
function closeSheet(){ scrim.hidden=true; sheet.innerHTML=''; }
scrim.addEventListener('click', e=>{ if(e.target===scrim && S.me) closeSheet(); });

function taskSheet(t){
  const me=S.me||'a', ot=other(me);
  openSheet(`<h3>${esc(t.title)}</h3>
    <div class="sub">${Number(t.points)||0} Punkte · ${REP_TEXT[rep(t)]}</div>
    <div class="btns">
      <button type="button" class="btn p${me}" id="doMe">${esc(nm(me))} hat's gemacht</button>
      <button type="button" class="btn p${ot}" id="doOther">${esc(nm(ot))} hat's gemacht</button>
    </div>
    <div class="btns"><button type="button" class="btn" id="edit">Bearbeiten</button><button type="button" class="btn" id="cl">Schließen</button></div>`);
  $('#doMe').onclick=()=>{ closeSheet(); complete(t, me); };
  $('#doOther').onclick=()=>{ closeSheet(); complete(t, ot); };
  $('#edit').onclick=()=>editSheet(t);
  $('#cl').onclick=closeSheet;
}

function editSheet(t){
  const isNew=!t; let pts = t ? (Number(t.points)||1) : 1; let r = t ? rep(t) : 'none';
  openSheet(`<h3>${isNew?'Neue Aufgabe':'Aufgabe bearbeiten'}</h3>
    <form id="tf" style="display:flex;flex-direction:column;gap:16px">
    <label class="f" for="f-title">Was ist zu tun?<input type="text" id="f-title" maxlength="80" placeholder="z.B. Katzenklo sauber machen" value="${esc(t?.title||'')}" required></label>
    <div class="row"><span style="font-weight:600;font-size:.88rem">Punkte<br><span class="sub">Wie aufwändig ist es?</span></span>
      <div class="stepper"><button type="button" id="f-minus" aria-label="Weniger">−</button><output id="f-pts">${pts}</output><button type="button" id="f-plus" aria-label="Mehr">+</button></div></div>
    <div class="fgroup"><span>Wiederholen</span>
      <div class="seg3" role="group" aria-label="Wiederholen" id="f-rep">
        <button type="button" data-r="none">Einmalig</button><button type="button" data-r="daily">Täglich</button><button type="button" data-r="weekly">Wöchentlich</button>
      </div>
      <span class="sub" id="f-rephint"></span></div>
    <div class="btns"><button type="submit" class="btn primary">${isNew?'Hinzufügen':'Speichern'}</button><button type="button" class="btn" id="f-cancel">Abbrechen</button></div>
    ${isNew?'':'<div class="btns"><button type="button" class="btn danger" id="f-del">Aufgabe löschen</button></div>'}
    </form>`);
  const out=$('#f-pts');
  $('#f-minus').onclick=()=>{ pts=Math.max(1,pts-1); out.textContent=pts; };
  $('#f-plus').onclick=()=>{ pts=Math.min(20,pts+1); out.textContent=pts; };
  $('#f-cancel').onclick=closeSheet;
  const setRep = v => { r=v; sheet.querySelectorAll('#f-rep button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.r===r))); $('#f-rephint').textContent=REP_HINT[r]; };
  sheet.querySelectorAll('#f-rep button').forEach(b=>b.onclick=()=>setRep(b.dataset.r));
  setRep(r);
  if(!isNew){ const del=$('#f-del'); del.onclick=async()=>{
    if(!del.classList.contains('sure')){ del.classList.add('sure'); del.textContent='Wirklich löschen?'; return; }
    closeSheet(); try{ await deleteDoc(doc(db,'tasks',t.id)); toast('Aufgabe gelöscht'); }catch(e){ toast('Löschen hat nicht geklappt.'); } }; }
  $('#tf').onsubmit=async ev=>{
    ev.preventDefault();
    const title=$('#f-title').value.trim(); if(!title) return;
    const daily = r==='daily'; closeSheet();
    try{
      if(isNew){ await setDoc(doc(db,'tasks',rid()), {title, points:pts, repeat:r, daily, done:false, createdAt:new Date().toISOString()}); toast('„'+title+'“ hinzugefügt'); }
      else await updateDoc(doc(db,'tasks',t.id), {title, points:pts, repeat:r, daily, done: r==='none' ? !!t.done : false});
    }catch(e){ toast('Speichern hat nicht geklappt.'); }
  };
}

function settingsSheet(first){
  let pick=S.me;
  openSheet(`<h3>${first?'Wer benutzt dieses Handy?':'Einstellungen'}</h3>
    ${first?'<div class="sub">Nach rechts wischen schreibt die Punkte dir gut, nach links der anderen Person.</div>':''}
    <div class="whogrid" role="group" aria-label="Ich bin">
      <button type="button" class="wa" data-w="a" aria-pressed="${pick==='a'}">${esc(nm('a'))}</button>
      <button type="button" class="wb" data-w="b" aria-pressed="${pick==='b'}">${esc(nm('b'))}</button></div>
    <label class="f" for="s-a">Name Person 1<input type="text" id="s-a" maxlength="20" value="${esc(S.names.a)}"></label>
    <label class="f" for="s-b">Name Person 2<input type="text" id="s-b" maxlength="20" value="${esc(S.names.b)}"></label>
    <div class="btns"><button type="button" class="btn primary" id="s-save">Speichern</button></div>
    ${first?'':'<button type="button" class="linkbtn" id="s-out">Abmelden</button>'}`);
  sheet.querySelectorAll('.whogrid button').forEach(b=>b.onclick=()=>{ pick=b.dataset.w;
    sheet.querySelectorAll('.whogrid button').forEach(x=>x.setAttribute('aria-pressed', String(x===b))); });
  $('#s-out')?.addEventListener('click', ()=>{ closeSheet(); signOut(auth); });
  $('#s-save').onclick=async()=>{
    if(!pick){ toast('Bitte wähle, wer du bist.'); return; }
    const a=$('#s-a').value.trim()||'Person 1', b=$('#s-b').value.trim()||'Person 2';
    S.me=pick; lsSet('hp.me',pick); closeSheet(); render();
    try{
      if(a!==S.names.a || b!==S.names.b) await setDoc(doc(db,'config','names'), {a,b});
      if(S.uid) await setDoc(doc(db,'members',S.uid), {who:pick});
    }catch(e){ toast('Speichern hat nicht geklappt.'); }
  };
}
$('#settingsBtn').onclick=()=>settingsSheet(false);
$('#fab').onclick=()=>editSheet(null);
document.querySelector('.seg').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; S.period=b.dataset.period; lsSet('hp.period',S.period); render(); });
$('#histList').addEventListener('click', e=>{
  const b=e.target.closest('[data-undo]'); if(!b) return;
  if(!b.classList.contains('sure')){ b.classList.add('sure'); b.textContent='Sicher?';
    setTimeout(()=>{ if(b.isConnected){ b.classList.remove('sure'); b.textContent='Zurücknehmen'; } }, 3000); return; }
  const [d,i]=b.dataset.undo.split('|'); undo(d,i);
});

let toastTimer;
function toast(msg, onUndo){
  const el=$('#toast'); $('#toastMsg').textContent=msg; const u=$('#toastUndo');
  u.hidden=!onUndo; u.onclick=()=>{ el.hidden=true; onUndo&&onUndo(); };
  el.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.hidden=true, 5000);
}

/* ---------- Anmeldung ---------- */
let signup=false;
const errText = c => ({
  'auth/invalid-credential':'E-Mail oder Passwort stimmt nicht.','auth/wrong-password':'E-Mail oder Passwort stimmt nicht.',
  'auth/user-not-found':'Kein Konto mit dieser E-Mail. Tippe auf „Konto erstellen“.','auth/email-already-in-use':'Für diese E-Mail gibt es schon ein Konto. Melde dich an.',
  'auth/weak-password':'Das Passwort braucht mindestens 6 Zeichen.','auth/invalid-email':'Diese E-Mail-Adresse sieht nicht richtig aus.',
  'auth/network-request-failed':'Keine Internetverbindung.','auth/too-many-requests':'Zu viele Versuche. Warte kurz und versuch es nochmal.'
}[c] || 'Das hat nicht geklappt ('+c+').');
$('#l-toggle').onclick=()=>{ signup=!signup;
  $('#loginTitle').textContent = signup?'Konto erstellen':'Anmelden';
  $('#l-submit').textContent = signup?'Konto erstellen':'Anmelden';
  $('#l-toggle').textContent = signup?'Schon ein Konto? Anmelden':'Noch kein Konto? Konto erstellen';
  $('#l-pw').autocomplete = signup?'new-password':'current-password'; $('#l-err').hidden=true; };
$('#login').onsubmit=async e=>{
  e.preventDefault(); const em=$('#l-email').value.trim(), pw=$('#l-pw').value; $('#l-err').hidden=true;
  try{ signup ? await createUserWithEmailAndPassword(auth, em, pw) : await signInWithEmailAndPassword(auth, em, pw); }
  catch(err){ $('#l-err').textContent=errText(err.code); $('#l-err').hidden=false; }
};

function denied(){
  $('#status').textContent='Dieses Konto hat keinen Zugriff. Prüfe, ob die E-Mail in den Freigaben (firestore.rules) steht.';
}
function startData(){
  S.unsubs.push(onSnapshot(doc(db,'config','names'), s=>{ if(s.exists()){ const d=s.data(); S.names={a:d.a||'Person 1', b:d.b||'Person 2'}; } S.loaded.names=true; render(); maybeAskWho(); }, denied));
  S.unsubs.push(onSnapshot(collection(db,'tasks'), s=>{ S.tasks=s.docs.map(d=>({id:d.id, ...d.data()})); S.loaded.tasks=true; $('#status').textContent=''; render(); }, denied));
  S.unsubs.push(onSnapshot(collection(db,'months'), s=>{ const m={}; s.docs.forEach(d=>m[d.id]=d.data()); S.months=m; render(); }, ()=>{}));
  S.unsubs.push(onSnapshot(collection(db,'shopping'), s=>{ S.shop=s.docs.map(d=>({id:d.id, ...d.data()})); S.loaded.shop=true; renderShop(); }, ()=>{}));
  getDoc(doc(db,'members',S.uid)).then(s=>{ if(s.exists() && s.data().who){ S.me=s.data().who; lsSet('hp.me',S.me); } })
    .catch(()=>{}).finally(()=>{ S.loaded.me=true; render(); maybeAskWho(); });
}
function maybeAskWho(){ if(S.me || !S.loaded.names || !S.loaded.me || !scrim.hidden) return; settingsSheet(true); }

onAuthStateChanged(auth, user=>{
  S.unsubs.forEach(u=>u()); S.unsubs=[];
  if(user){
    S.uid=user.uid; $('#login').hidden=true; $('#app').hidden=false; setTab(S.tab); render(); startData();
  } else {
    S.uid=null; S.loaded={tasks:false,names:false,me:false,shop:false}; $('#app').hidden=true; $('#fab').hidden=true; $('#login').hidden=false;
  }
});
setInterval(()=>{ if(S._day!==dayKey()){ S._day=dayKey(); render(); } }, 60000); S._day=dayKey();
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) render(); });
</script>
